<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/info-table.css" />
  </head>
  <body>
    <div class="header">
      <img id="login-logo-theme" src="./images/logo.svg" alt="TargetVideo Logo"/>
    </div>
    
    <div id="bplrStatus" class="bplrText">Checking this page…</div>
    
    <div class="sectionLabel">Player info</div>
    <div class="buttons">
      <button class="button" id="bplrPlayerInfo" title="Log player details to the console (F12)">Log to console</button>
      <button class="button" id="playerInfoEmbed" title="Add an info table above each player">Show on page</button>
    </div>
    
    <div class="sectionLabel">Tools</div>
    <div class="buttons">
      <button class="button" id="enableDebug" title="Turn on debug mode and reload">Enable debug</button>
      <button class="button" id="clearBplrLocalStorage" title="Clear all local storage for this site">Clear local storage</button>
    </div>
    
    <div id="bplrNotice" class="bplrText"></div>
    
    <script src="js/execute.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
